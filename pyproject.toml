[project]
name = "gemmapollo-scribe"
version = "0.1.0"
description = "Local real-time math scribe: voice -> LaTeX with agentic editing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "websockets>=12",
]

[project.optional-dependencies]
s2l = [
  # Phase 3: real engine
  "faster-whisper>=1.0",
  "transformers>=4.44",
  "torch>=2.3",
  "accelerate",
  "bitsandbytes",
  # vendor github.com/DingoOz/speech-to-LateX or add as git dep here
]
audio = [
  # Phase 4/5
  "sounddevice",
  "silero-vad",
  "openwakeword",
]
eval = ["sympy", "jiwer"]
dev = ["pytest>=8"]

[project.scripts]
scribe = "scribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]
