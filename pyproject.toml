[project]
name = "gemmapollo-scribe"
version = "0.1.0"
description = "Local real-time math scribe: voice -> LaTeX with agentic editing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "websockets>=12",
  "numpy>=1.26",  # audio arrays are a wire type (chunker, wav encode) — keep pure-logic testable
]

[project.optional-dependencies]
s2l = [
  # Phase 3 real engine. Model-loading logic is vendored from
  # github.com/DingoOz/speech-to-LateX into engine/s2l_engine.py + metrics.py
  # (their pyproject pins bleeding-edge torch/transformers we don't need).
  "faster-whisper>=1.0",
  "transformers>=4.44",
  "torch>=2.7",
]
audio = [
  # Phase 4 + 5
  "sounddevice>=0.5",
  "silero-vad>=5.1",
  "openwakeword>=0.6",
  "onnxruntime>=1.17",  # oww inference backend on Windows (no tflite-runtime wheels)
]
eval = ["sympy", "jiwer"]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: starlette TestClient ws round-trip tests

[project.scripts]
scribe = "scribe.cli:main"

[[tool.uv.index]]
# CUDA 12.8 wheels (RTX 4060 Ti / sm_89; also covers 50-series sm_120).
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  # CUDA wheels only where NVIDIA is plausible; every environment NOT matched
  # by a marker (macOS, ARM Linux) resolves torch from PyPI — the universal
  # CPU/MPS wheel. CPU-only x86_64 Linux still gets the CUDA build (runs fine
  # on CPU, just a bigger download); use --engine remote there to skip torch
  # entirely on the app host.
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]
